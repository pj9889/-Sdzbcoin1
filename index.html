<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বাগতম - অফিসিয়াল পোর্টাল</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .full-bg {
            background-image: url('z1.webp');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .button-container {
            margin-top: 150px; /* পজিশন সামান্য নিচে করার জন্য */
        }

        .cta-btn {
            background-color: #FF0000;
            color: white;
            padding: 20px 60px;
            font-size: 26px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: inline-block;
            animation: pulse-popup 1.5s infinite; /* নড়াচড়া ও পপআপ অ্যানিমেশন */
            transition: background-color 0.1s;
        }

        @keyframes pulse-popup {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .cta-btn:active {
            background-color: #FFFF00 !important;
            color: #000 !important;
            animation: none;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="full-bg">
        <div class="button-container">
            <a href="https://Sdzbcoin.pages.dev" class="cta-btn" id="startBtn">শুরু করুন</a>
        </div>
    </div>

    <script>
        const btn = document.getElementById('startBtn');
        const trigger = () => {
            btn.style.backgroundColor = '#FFFF00';
            btn.style.color = '#000';
        };
        btn.addEventListener('mousedown', trigger);
        btn.addEventListener('touchstart', trigger);
    </script>

</body>
</html>
