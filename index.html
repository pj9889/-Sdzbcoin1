<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বাগতম</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .full-bg {
            background-image: url('z1.webp');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* বাটনটি নিচে রাখার জন্য */
            padding-bottom: 80px; /* নিচ থেকে দূরত্ব */
        }

        .cta-btn {
            background-color: #FF0000;
            color: white;
            padding: 20px 60px;
            font-size: 26px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: inline-block;
            transition: transform 0.2s ease;
            animation: popup 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* পপআপ অ্যানিমেশন */
        }

        @keyframes popup {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cta-btn:active {
            background-color: #FFFF00 !important;
            color: #000 !important;
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="full-bg">
        <a href="https://Sdzbcoin.pages.dev" class="cta-btn" id="startBtn">শুরু করুন</a>
    </div>

    <script>
        const btn = document.getElementById('startBtn');
        const changeColor = () => {
            btn.style.backgroundColor = '#FFFF00';
            btn.style.color = '#000';
        };
        btn.addEventListener('mousedown', changeColor);
        btn.addEventListener('touchstart', changeColor);
    </script>

</body>
</html>
